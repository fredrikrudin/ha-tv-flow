# Trafikverket Trafikkarta – automatic dashboard (v1.1.0+)
#
# Order and content are set in the integration:
#   Settings → Devices & services → Trafikverket Trafikkarta → Configure → Dashboard and map
# Texts follow Home Assistant's language (Swedish or English).
#
# Install:
#   Settings → Dashboards → Add dashboard → New dashboard from scratch
#   Open it → ✏️ Edit → ⋮ → Raw configuration editor → paste → Save.
#
# With several locations: add "entry: <config_entry_id>" (available as the
# config_entry_id attribute of sensor.tv_flow_flow_sites / _2 …).

strategy:
  type: custom:tv-flow
