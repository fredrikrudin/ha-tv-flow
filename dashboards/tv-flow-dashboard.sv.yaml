# Trafikverket Trafikkarta – static dashboard (Swedish)
#
# Generated from the dashboard strategy "custom:tv-flow" (same layout and content).
# Prefer the strategy if you want to choose order and content in the integration settings:
#   strategy:
#     type: custom:tv-flow
#
# Install:
#   Settings → Dashboards → Add dashboard → "New dashboard from scratch"
#   Open it → ✏️ Edit → ⋮ → "Raw configuration editor" → paste this file → Save.
#
# Requires only the integration (the cards are registered automatically).
# With several locations, entities of location 2 end with _2 (e.g. sensor.tv_flow_average_speed_2):
# copy the view, add _2 to the entities and set "entry:" on the map and road cards.
#
# English version: tv-flow-dashboard.yaml

title: Trafik
views:
- title: Trafik
  path: trafik
  icon: mdi:car-traffic
  type: sections
  max_columns: 4
  badges:
  - type: entity
    entity: weather.tv_flow
    show_name: false
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.tv_flow_air_temperature
    name: Luft
    show_name: true
    color: orange
  - type: entity
    entity: sensor.tv_flow_surface_temperature
    name: Vägbana
    show_name: true
    color: blue-grey
  - type: entity
    entity: sensor.tv_flow_average_speed
    name: Snitt
    show_name: true
    color: green
  - type: entity
    entity: sensor.tv_flow_road_condition
    name: Väglag
    show_name: true
    color: amber
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Vägöversikt
      icon: mdi:road-variant
    - type: custom:trafikverket-road-card
      max_roads: 3
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Väder vid vägen
      icon: mdi:weather-partly-snowy-rainy
    - type: weather-forecast
      entity: weather.tv_flow
      name: Lokalt väder
      show_current: true
      show_forecast: false
      secondary_info_attribute: wind_speed
      grid_options:
        columns: full
    - type: tile
      entity: sensor.tv_flow_air_temperature
      name: Luft
      color: orange
    - type: tile
      entity: sensor.tv_flow_surface_temperature
      name: Vägbana
      color: blue-grey
    - type: tile
      entity: sensor.tv_flow_wind_speed
      name: Vind
      color: cyan
      icon: mdi:weather-windy
    - type: tile
      entity: sensor.tv_flow_humidity
      name: Luftfuktighet
      color: light-blue
    - type: tile
      entity: sensor.tv_flow_precipitation
      name: Nederbörd
      color: blue
    - type: tile
      entity: sensor.tv_flow_precipitation_30min
      name: Senaste 30 min
      color: blue
      icon: mdi:cup-water
    - type: tile
      entity: sensor.tv_flow_visibility
      name: Sikt
      color: grey
    - type: tile
      entity: sensor.tv_flow_grip
      name: Friktion
      color: amber
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: '<small>Station: **{{ state_attr(''weather.tv_flow'', ''station'') or ''–'' }}**, {{ state_attr(''weather.tv_flow'', ''distance_km'') or ''–'' }} km bort · mätt {{ (as_datetime(state_attr(''weather.tv_flow'', ''sample'')) | as_local).strftime(''%H:%M'') if state_attr(''weather.tv_flow'', ''sample'') else ''–'' }}</small>'
  - type: grid
    cards:
    - type: heading
      heading: Väglag
      icon: mdi:road-variant
    - type: tile
      entity: sensor.tv_flow_road_condition
      name: Sämsta väglag
      color: amber
      grid_options:
        columns: full
    - type: tile
      entity: sensor.tv_flow_road_condition_count
      name: Besvärliga sträckor
      color: deep-orange
      icon: mdi:alert-outline
    - type: tile
      entity: sensor.tv_flow_surface_temperature
      name: Vägbana
      color: blue-grey
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {%- set roads = states.geo_location
            | selectattr('attributes.tv_type', 'defined')
            | selectattr('attributes.tv_type', 'eq', 'road')
            | selectattr('attributes.condition_code', 'number')
            | selectattr('attributes.condition_code', 'gt', 1)
            | sort(attribute='attributes.condition_code', reverse=true) | list %}
        {%- if roads %}
        {% for r in roads[:6] -%}
        {%- set icon = {2: '🟡', 3: '🔴', 4: '🔵'}[r.attributes.condition_code] | default('⚪') -%}
        {{ icon }} **{{ r.attributes.road_number or 'Väg' }}** – {{ r.attributes.condition_text }}
        {%- if r.attributes.warning %} · {{ r.attributes.warning }}{% endif %}
        {%- if r.attributes.measure %} · {{ r.attributes.measure | lower }}{% endif %}
        <br><small>{{ r.attributes.location_text or '' }} ({{ r.state }} km)</small>

        {% endfor %}
        {%- else %}
        🟢 Normalt väglag inom radien.
        {%- endif %}
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Trafikkarta
      heading_style: title
      icon: mdi:map-marker-radius
      badges:
      - type: entity
        entity: sensor.tv_flow_flow_sites
        name: null
        show_name: false
        color: blue
        show_state: true
        show_icon: true
    - type: custom:trafikverket-map-card
      height: 560
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Läget nu
      icon: mdi:car-clock
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.tv_flow_road_condition
        state_not: normal
      - condition: state
        entity: sensor.tv_flow_road_condition
        state_not: no_data
      card:
        type: markdown
        content: '<ha-alert alert-type="warning" title="{{ state_attr(''sensor.tv_flow_road_condition'', ''state_text'') or state_translated(''sensor.tv_flow_road_condition'') }}">{%- set w = state_attr(''sensor.tv_flow_road_condition'', ''warnings'') or [] %}{%- set c = state_attr(''sensor.tv_flow_road_condition'', ''causes'') or [] %} {{ states(''sensor.tv_flow_road_condition_count'') }} sträckor med besvärligt väglag.{%- if w %} Varning: {{ w | join('', '') }}.{% endif %}{%- if c %} Orsak: {{ c | join('', '') | lower }}.{% endif %}</ha-alert>'
      grid_options:
        columns: full
    - type: tile
      entity: sensor.tv_flow_average_speed
      name: Medelhastighet
      color: green
      icon: mdi:speedometer
    - type: tile
      entity: sensor.tv_flow_lowest_speed
      name: Lägsta hastighet
      color: red
      icon: mdi:speedometer-slow
    - type: tile
      entity: sensor.tv_flow_total_flow
      name: Trafikflöde
      color: indigo
      icon: mdi:car-multiple
    - type: tile
      entity: sensor.tv_flow_flow_sites
      name: Mätpunkter
      color: blue
      icon: mdi:map-marker-multiple
    - type: markdown
      title: Långsammast just nu
      grid_options:
        columns: full
      content: |-
        {%- set sites = states.geo_location
            | selectattr('attributes.tv_type', 'defined')
            | selectattr('attributes.tv_type', 'eq', 'flow')
            | selectattr('attributes.average_speed', 'number')
            | sort(attribute='attributes.average_speed') | list %}
        {%- if sites %}
        | | Mätpunkt | km/h | fordon/h | Avstånd |
        |:-:|:--|--:|--:|--:|
        {% for s in sites[:6] -%}
        {%- set v = s.attributes.average_speed -%}
        | {{ '🔴' if v < 30 else '🟠' if v < 50 else '🟡' if v < 70 else '🟢' }} | {{ s.attributes.site_id }} | {{ v | round(0) | int }} | {{ s.attributes.flow }} | {{ s.state }} km |
        {% endfor %}
        {%- else %}
        Inga mätpunkter med hastighet inom radien just nu.
        {%- endif %}
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Historik
      icon: mdi:chart-line
    - type: history-graph
      title: Hastighet senaste dygnet
      hours_to_show: 24
      entities:
      - entity: sensor.tv_flow_average_speed
        name: Medel
      - entity: sensor.tv_flow_lowest_speed
        name: Lägsta
      grid_options:
        columns: 12
    - type: history-graph
      title: Temperatur luft och vägbana
      hours_to_show: 24
      entities:
      - entity: sensor.tv_flow_air_temperature
        name: Luft
      - entity: sensor.tv_flow_surface_temperature
        name: Vägbana
      grid_options:
        columns: 12
    - type: statistics-graph
      title: Trafikflöde senaste veckan
      entities:
      - entity: sensor.tv_flow_total_flow
        name: Fordon/h
      period: hour
      days_to_show: 7
      stat_types:
      - mean
      - max
      chart_type: line
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Datamängd
      icon: mdi:download-network
      heading_style: subtitle
    - type: tile
      entity: sensor.tv_flow_data_usage
      name: Hämtat sedan start
      color: purple
    - type: tile
      entity: sensor.tv_flow_response_size
      name: Per hämtning
      color: purple
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: <small>Radie **{{ state_attr('sensor.tv_flow_flow_sites', 'radius_km') }} km** · väder **{{ state_attr('sensor.tv_flow_flow_sites', 'weather_radius_km') }} km** · uppdateras var **{{ state_attr('sensor.tv_flow_flow_sites', 'scan_interval_min') }} min** · {{ state_attr('sensor.tv_flow_data_usage', 'requests') or 0 }} anrop sedan start. Ordning och innehåll ändras under Inställningar → Enheter och tjänster → Trafikverket Trafikkarta → Konfigurera → Dashboard och karta.</small>
